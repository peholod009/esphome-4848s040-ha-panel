<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=480">
<title>Сарай — Главная</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&amp;display=swap">
<style>
  body{margin:0;background:#FFFFFF;font-family:"Nunito",system-ui,sans-serif;font-weight:600}
  .u{font-weight:800}
  .ab{position:absolute}
  /* показания: плоская светлая карточка, без рамки и «губы» */
  .card{position:absolute;box-sizing:border-box;border-radius:22px;background:#F3F4F8}
  .fg{color:#212121}
  .mut{color:#606682}
  /* клавиша: текущая подложка плиток (градиент + обводка) + толстая нижняя «губа» */
  .key{position:absolute;box-sizing:border-box;border-radius:22px;background:linear-gradient(180deg,#F7F7FB 0%,#E8EBF4 100%);border:2px solid #C7CCDE;border-bottom:6px solid #A9AFC4;cursor:pointer;text-decoration:none;padding:0;font:inherit;color:#212121}
  .tab{position:absolute;top:400px;width:108px;height:68px;box-sizing:border-box;border-radius:20px;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:17px;cursor:pointer}
  .tab-off{background:linear-gradient(180deg,#F7F7FB 0%,#E8EBF4 100%);border:2px solid #C7CCDE;border-bottom:6px solid #A9AFC4;color:#212121}
  /* активная вкладка «вдавлена»: без губы, опущена на 4 px, заливка серо-синим */
  .tab-on{top:404px;height:64px;background:#606682;border:2px solid #606682;color:#FFFFFF}
</style>
</head>
<body>
<div style="position:relative;width:480px;height:480px;background:#FFFFFF;overflow:hidden;box-sizing:border-box">

  <!-- ===== Ряд A: время | улица ===== -->
  <div class="card" style="left:12px;top:12px;width:228px;height:116px">
    <div class="ab u fg" style="left:18px;top:14px;font-size:48px;line-height:56px;letter-spacing:-1px">16:40</div>
    <div class="ab mut" style="left:20px;top:78px;font-size:18px;line-height:22px">сб, 10 октября</div>
  </div>

  <div class="card" style="left:252px;top:12px;width:216px;height:116px">
    <!-- mdi-weather-partly-cloudy -->
    <svg class="ab" style="left:14px;top:16px" width="46" height="46" viewBox="0 0 24 24" aria-hidden="true"><path fill="#F37320" d="M12.74,5.47C15.1,6.5 16.35,9.03 15.92,11.46C17.19,12.56 18,14.19 18,16V16.17C18.31,16.06 18.65,16 19,16A3,3 0 0,1 22,19A3,3 0 0,1 19,22H6A4,4 0 0,1 2,18A4,4 0 0,1 6,14H6.27C5,12.45 4.6,10.24 5.5,8.26C6.72,5.5 9.97,4.24 12.74,5.47M11.93,7.3C10.16,6.5 8.09,7.31 7.31,9.07C6.85,10.09 6.93,11.22 7.41,12.13C8.5,10.83 10.16,10 12,10C12.7,10 13.38,10.12 14,10.34C13.94,9.06 13.18,7.86 11.930,7.3M19,18H16V16A4,4 0 0,0 12,12A4,4 0 0,0 8,16H6A2,2 0 0,0 4,18A2,2 0 0,0 6,20H19A1,1 0 0,0 20,19A1,1 0 0,0 19,18Z"></path></svg>
    <div class="ab u fg" style="left:72px;top:14px;font-size:44px;line-height:52px;letter-spacing:-1px">23°</div>
    <div class="ab mut" style="left:16px;top:78px;font-size:18px;line-height:22px">малооблачно</div>
    <!-- mdi-water -->
    <svg class="ab" style="left:136px;top:79px" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#3FA7F3" d="M12,20A6,6 0 0,1 6,14C6,10 12,3.25 12,3.25C12,3.25 18,10 18,14A6,6 0 0,1 12,20Z"></path></svg>
    <div class="ab fg" style="left:158px;top:78px;font-size:18px;line-height:22px">46%</div>
  </div>

  <!-- ===== Ряд B: парная (главная плашка) | баня + туалет ===== -->
  <div class="card" style="left:12px;top:140px;width:228px;height:150px;background:#FDEEE3">
    <!-- mdi-thermometer -->
    <svg class="ab" style="left:14px;top:14px" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="#F37320" d="M15 13V5A3 3 0 0 0 9 5V13A5 5 0 1 0 15 13M12 4A1 1 0 0 1 13 5V8H11V5A1 1 0 0 1 12 4Z"></path></svg>
    <div class="ab u" style="left:42px;top:16px;font-size:16px;line-height:20px;color:#B4500E;letter-spacing:.5px">ПАРНАЯ</div>
    <div class="ab u fg" style="left:14px;top:38px;font-size:64px;line-height:68px;letter-spacing:-2px">68°</div>
    <!-- тренд: стрелка + слово -->
    <div class="ab" style="left:14px;top:110px;height:28px;padding:0 12px 0 8px;border-radius:14px;background:#FFFFFF;display:flex;align-items:center;gap:6px">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#F37320" d="M16,6L18.29,8.29L13.41,13.17L9.41,9.17L2,16.59L3.41,18L9.41,12L13.41,16L19.71,9.71L22,12V6H16Z"></path></svg>
      <span style="font-size:16px;line-height:20px;color:#B4500E">греется</span>
    </div>
  </div>

  <!-- Баня: ЗАНЯТА — красная плашка (тон текущего «занято») + слово капсом -->
  <div class="card" style="left:252px;top:140px;width:216px;height:69px;background:#FCE4E4">
    <svg class="ab" style="left:14px;top:20px" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="#EB5757" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M7 3.5c-1 1.8 1 2.8 0 4.8M12 3.5c-1 1.8 1 2.8 0 4.8M17 3.5c-1 1.8 1 2.8 0 4.8M4 12h16v4a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"></path></svg>
    <div class="ab mut" style="left:54px;top:9px;font-size:16px;line-height:20px">Баня</div>
    <div class="ab u" style="left:54px;top:31px;font-size:20px;line-height:26px;color:#B3261E">ЗАНЯТА</div>
  </div>

  <!-- Туалет: свободен — зелёная плашка (тон текущего «свободно») -->
  <div class="card" style="left:252px;top:221px;width:216px;height:69px;background:#E3F4EA">
    <svg class="ab" style="left:14px;top:20px" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="#219653" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M14 3h5v8h-5zM3 11h18v1a7 7 0 0 1-5 6.5V21H9v-2.5A7 7 0 0 1 3 12z"></path></svg>
    <div class="ab mut" style="left:54px;top:9px;font-size:16px;line-height:20px">Туалет</div>
    <div class="ab" style="left:54px;top:31px;font-size:20px;line-height:26px;color:#1B7A43">свободен</div>
  </div>

  <!-- ===== Ряд C: мини-плеер на всю ширину: трек + слайдер громкости | пауза ===== -->
  <div class="card" style="left:12px;top:302px;width:456px;height:86px;background:linear-gradient(90deg,#FDECD9 0%,#F3F4F8 100%)">
    <svg class="ab" style="left:16px;top:15px" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="6" width="3" height="10" rx="1" fill="#F37320"/><rect x="6.5" y="1" width="3" height="15" rx="1" fill="#F37320"/><rect x="12" y="9" width="3" height="7" rx="1" fill="#F37320"/></svg>
    <div class="ab fg" style="left:38px;top:9px;width:326px;font-size:19px;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span style="color:#B4500E;font-size:16px">Играет · </span>It's A Beautiful Day</div>
    <svg class="ab" style="left:14px;top:46px" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="#606682" d="M3,9V15H7L12,20V4L7,9H3Z"/><path fill="none" stroke="#606682" stroke-width="2" stroke-linecap="round" d="M15 9.5a3.5 3.5 0 0 1 0 5"/></svg>
    <div class="ab" style="left:58px;top:48px;width:234px;height:20px;border-radius:10px;background:#E3E5EC">
      <div class="ab" style="left:0;top:0;width:117px;height:20px;border-radius:10px;background:#F37320"></div>
      <div class="ab" style="left:101px;top:-6px;width:32px;height:32px;border-radius:16px;box-sizing:border-box;background:#FFFFFF;border:4px solid #606682"></div>
    </div>
    <div class="ab u fg" style="left:312px;top:44px;width:54px;text-align:right;font-size:20px;line-height:28px">50%</div>
    <button class="key" aria-label="Пауза" style="left:380px;top:10px;width:64px;height:66px;border-radius:20px;background:#F37320;border-color:#F37320;border-bottom-color:#C85A12;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FFFFFF" d="M14,19H18V5H14M6,19H10V5H6V19Z"/></svg></button>
  </div>
  <!-- ===== Таб-бар: 4 вкладки, иконка + подпись всегда ===== -->
  <a class="tab tab-on" href="main.html" style="left:12px" aria-current="page">
    <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FFFFFF" d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z"></path></svg>
    <span>Главная</span>
  </a>
  <a class="tab tab-off" href="light.html" style="left:128px">
    <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path fill="#F37320" d="M12,2A7,7 0 0,0 5,9C5,11.38 6.19,13.47 8,14.74V17A1,1 0 0,0 9,18H15A1,1 0 0,0 16,17V14.74C17.81,13.47 19,11.38 19,9A7,7 0 0,0 12,2M9,21A1,1 0 0,0 10,22H14A1,1 0 0,0 15,21V20H9V21Z"></path></svg>
    <span>Сарай</span>
  </a>
  <a class="tab tab-off" href="yard.html" style="left:244px">
    <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path fill="#F37320" d="M14.015625 3.0 12.984375 0.984375H11.015625L9.984375 3.0L5.015625 6.0H6.984375L8.015625 14.015625L9.984375 15.984375L10.5 17.015625H9.0V23.015625H15.0V17.015625H13.5L14.015625 15.984375L15.984375 14.015625L17.015625 6.0H18.984375ZM14.15625 12.984375H9.84375L9.0 6.0H15.0Z"></path></svg>
    <span>Двор</span>
  </a>
  <a class="tab tab-off" href="music.html" style="left:360px">
    <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path fill="#F37320" d="M21,3V15.5A3.5,3.5 0 0,1 17.5,19A3.5,3.5 0 0,1 14,15.5A3.5,3.5 0 0,1 17.5,12C18.04,12 18.55,12.12 19,12.34V6.47L9,8.6V17.5A3.5,3.5 0 0,1 5.5,21A3.5,3.5 0 0,1 2,17.5A3.5,3.5 0 0,1 5.5,14C6.04,14 6.55,14.12 7,14.34V6L21,3Z"></path></svg>
    <span>Музыка</span>
  </a>

</div>
</body>
</html>
