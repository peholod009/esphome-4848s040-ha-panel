    id: mdi_16
    size: 16
    bpp: 8
    glyphs: [$mdi_equalizer]

  # тренд парной, капля влажности
  - file: 'https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf'
    id: mdi_20
    size: 20
    bpp: 8
    glyphs: [$mdi_trending_up, $mdi_trending_down, $mdi_trending_neutral, $mdi_water, $mdi_wifi, $mdi_ip_network, $mdi_heart, $mdi_waveform]

  # парная, громкость в мини-плеере
