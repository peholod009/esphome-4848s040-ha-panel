  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_16
    size: 16
    bpp: 8
    glyphsets: ${glyphsets}

  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_17
    size: 17
    bpp: 8
    glyphsets: ${glyphsets}

  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_19
    size: 19
    bpp: 8
    glyphsets: ${title_glyphsets}

  - file:
      type: gfonts
      family: Nunito
      weight: 800
    id: nb_16
    size: 16
    bpp: 8
    glyphs: "ПАРНЯВКЛ"

  - file:
      type: gfonts
      family: Nunito
      weight: 800
    id: nb_20
    size: 20
    bpp: 8
    glyphsets: ${glyphsets}

  - file:
      type: gfonts
      family: Nunito
      weight: 800
    id: nb_24
    size: 24
    bpp: 8
    glyphs: "0123456789%-"

  - file:
      type: gfonts
      family: Nunito
      weight: 800
    id: nb_26
    size: 26
    bpp: 8
    glyphsets: ${title_glyphsets}

  - file:
      type: gfonts
      family: Nunito
      weight: 800
    id: nb_28
    size: 28
    bpp: 8
    glyphs: "0123456789%-"

  - file:
      type: gfonts
      family: Nunito
      weight: 800
    id: nb_44
    size: 44
    bpp: 8
    glyphs: "0123456789°-.,+"

  - file:
      type: gfonts
      family: Nunito
      weight: 800
    id: nb_48
    size: 48
    bpp: 8
    glyphs: "0123456789:-"

  - file:
      type: gfonts
      family: Nunito
      weight: 800
    id: nb_64
    size: 64
    bpp: 8
    glyphs: "0123456789°-"

  # нужен библиотечному поповеру color-picker (substitution icon_font)
  - file: 'https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf'
    id: mdi_icons_40
    size: 40
    bpp: 8
    glyphs: [$mdi_brightness_6, $mdi_circle_opacity, $mdi_eyedropper, $mdi_white_balance_sunny, $mdi_lightbulb]

  # значок «играет»
