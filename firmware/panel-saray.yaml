            return x ? Color(0xF3, 0x73, 0x20) : Color(0x60, 0x66, 0x82);
      - lvgl.obj.update:
          id: sw_vnutri
          bg_color: !lambda |-
            return x ? Color(0xF3, 0x73, 0x20) : Color(0xE3, 0xE5, 0xEC);
          border_width: !lambda |-
            return x ? 0 : 2;
      - lvgl.obj.update:
          id: knob_vnutri
          x: !lambda |-
            return x ? 23 : 2;
          y: !lambda |-
            return x ? 3 : 2;
          width: !lambda |-
            return x ? 22 : 20;
          height: !lambda |-
            return x ? 22 : 20;
          shadow_opa: !lambda |-
            return x ? 0 : 64;
      - if:
          condition:
            lambda: return x;
          then:
            - lvgl.label.update:
                id: state_vnutri
                text: "ВКЛ"
                text_font: nb_16
