        # Скрытый контейнер: виджеты, которые библиотечные пакеты (погода,
        # диагностика sensors_base) обновляют по id. Без них сборка падает с
        # "ID not found"; на экране они не нужны — скрыты целиком.
        - obj:
            x: 0
