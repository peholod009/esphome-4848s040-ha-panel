    # без этого on_state не срабатывает на ПЕРВОЕ состояние после загрузки —
    # плитки показывали бы «выкл», пока свет не переключат
    trigger_on_initial_state: true
    on_state:
      - lvgl.widget.update:
          id: tile_y_tualet_out
          state:
            checked: !lambda return x;
      - lvgl.label.update:
          id: icon_y_tualet_out
          text: !lambda |-
            return std::string(x ? "$mdi_lightbulb" : "$mdi_lightbulb_outline");
          text_color: !lambda |-
            return x ? Color(0xF3, 0x73, 0x20) : Color(0x60, 0x66, 0x82);
      - lvgl.obj.update:
          id: sw_y_tualet_out
          bg_color: !lambda |-
            return x ? Color(0xF3, 0x73, 0x20) : Color(0xE3, 0xE5, 0xEC);
          border_width: !lambda |-
            return x ? 0 : 2;
      - lvgl.obj.update:
          id: knob_y_tualet_out
          x: !lambda |-
            return x ? 21 : 2;
          y: !lambda |-
            return x ? 3 : 2;
          width: !lambda |-
            return x ? 16 : 14;
          height: !lambda |-
            return x ? 16 : 14;
          shadow_opa: !lambda |-
            return x ? 0 : 64;
      - if:
          condition:
            lambda: return x;
          then:
            - lvgl.label.update:
                id: state_y_tualet_out
                text: "ВКЛ"
                text_font: nb_16
                text_color: 0xB4500E
          else:
            - lvgl.label.update:
                id: state_y_tualet_out
                text: "выкл"
                text_font: nunito_16
                text_color: 0x606682

# ----------------------------------------------------------------------------
# Экраны. Всё позиционируется абсолютно, как в макете (x/y от левого верхнего
# угла родителя, внутри его рамки). pad_all: 0 у всех контейнеров и кнопок —
# у кнопок библиотечной темы по умолчанию pad_all: 10.
# ----------------------------------------------------------------------------
lvgl:
  # Гашение по таймауту бездействия (number «Backlight timeout», мин; −1 = никогда).
  # Сейчас экраном управляет HA, таймаут в HA стоит −1 — блок спит.
  on_idle:
    timeout: !lambda return (uint32_t)(id(display_backlight_timeout).state * 60000);
    then:
      - if:
          condition:
            lambda: 'return id(display_backlight_timeout).state > 0;'
          then:
            - light.turn_off: display_backlight
  # Касание тёмного (приостановленного) экрана: будим и включаем подсветку
  on_resume:
    then:
      - script.execute: apply_brightness_mode
  gradients:
    # подложка клавиш (текущая, как у плиток света)
    - id: tile_card_gradient
      direction: ver
      stops:
        - color: 0xF7F7FB
          position: 0
        - color: 0xE8EBF4
          position: 255
    # включённая плитка — сплошной светло-оранжевый (градиент из одного цвета,
    # чтобы в состоянии checked просто подменить подложку)
    - id: tile_on_gradient
      direction: ver
      stops:
        - color: 0xFDECD9
          position: 0
        - color: 0xFDECD9
          position: 255
    # выбранный вариант в группе на экране «Настройки» — сплошной серо-синий
    - id: seg_on_gradient
      direction: ver
      stops:
        - color: 0x606682
          position: 0
        - color: 0x606682
          position: 255
    # оранжевая клавиша (пауза) — сплошной оранжевый
    - id: orange_gradient
      direction: ver
      stops:
        - color: 0xF37320
          position: 0
        - color: 0xF37320
          position: 255
    # карточка «сейчас играет»: от оранжевого тона к серому, слева направо
    - id: music_card_gradient
      direction: hor
      stops:
        - color: 0xFDECD9
          position: 0
        - color: 0xF3F4F8
          position: 255

  style_definitions:
    - id: !extend page_style
      bg_color: white
      bg_opa: COVER
      pad_all: 0

    # показание: плоская светлая карточка без рамки, тени и губы
    - id: card_style
      bg_color: 0xF3F4F8
      bg_opa: COVER
      radius: 22
      border_width: 0
      shadow_width: 0
      pad_all: 0

    # клавиша: подложка-градиент, рамка 2px, губа 4px (жёсткая тень снизу)
    - id: key_style
      bg_grad: tile_card_gradient
      bg_opa: COVER
      border_width: 2
      border_color: 0xC7CCDE
      radius: 22
      pad_all: 0
      shadow_width: 1
      shadow_spread: 0
      shadow_offset_x: 0
      shadow_offset_y: 4
      shadow_color: 0xA9AFC4
      shadow_opa: COVER

    # «вдавливание» при нажатии: кнопка опускается на губу
    - id: key_pressed_style
      translate_y: 4
      shadow_offset_y: 0

    # оранжевая клавиша (пауза)
    - id: key_orange_style
      bg_grad: orange_gradient
      border_color: 0xF37320
      shadow_color: 0xC85A12

    # активная вкладка: залита серо-синим, без губы, опущена на 4 px
    - id: tab_on_style
      bg_color: 0x606682
      bg_opa: COVER
      border_width: 2
      border_color: 0x606682
      radius: 20
      pad_all: 0
      shadow_width: 0

